# NOTE: see https://gitversion.net/docs/reference/modes/mainline for information on how this works
# NOTE: see https://gitversion.net/docs/reference/version-increments for information on how to manually influence version numbers (major and minor should be set)
#  use a commit message of '+semver:breaking' or '+semver:major' to raise major
#  use a commit message of '+semver:feature'  or '+semver:minor' to raise minor
assembly-versioning-scheme: MajorMinorPatch
mode: ManualDeployment
branches:
  main:
    label: ''
    increment: Patch
    mode: ContinuousDeployment
  feature:
    label: 'ALPHA'
    increment: Patch
update-build-number: true
commit-message-incrementing: Enabled
